# Builds the site and deploys it to Cloudflare (free plan) on every push to main.
# Same setup as Gathered: a Next.js Worker ("throvic-site") behind the "throvic" Pages project.
#
# Repo → Settings → Secrets and variables → Actions:
#   Secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   Variables (optional): NEXT_PUBLIC_GA_ID, NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION, NEXT_PUBLIC_BING_SITE_VERIFICATION
# GROQ_API_KEY is a Worker secret (npx wrangler secret put GROQ_API_KEY), never stored in GitHub.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Baked into the pages at build time.
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://throvic.pages.dev' }}
      NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
      NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
      NEXT_PUBLIC_BING_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_BING_SITE_VERIFICATION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check types and lint
        run: npx tsc --noEmit && npx eslint src

      - name: Build (Next.js → Cloudflare Worker)
        run: npx opennextjs-cloudflare build

      - name: Deploy the Worker (throvic-site)
        run: npx opennextjs-cloudflare deploy

      - name: Deploy the public Pages front (throvic.pages.dev)
        run: |
          node scripts/prepare-pages.mjs
          cd cloudflare-pages
          npx wrangler pages deploy dist --project-name throvic --branch main --commit-dirty=true

      - name: Tell Bing about changed pages (IndexNow; also feeds ChatGPT search and Copilot)
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          sleep 20
          node scripts/indexnow.mjs
